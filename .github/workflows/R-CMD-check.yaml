# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, v3, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full check with all Suggests, INLA included
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          extra-repositories: 'https://inla.r-inla-download.org/R/stable'

      - name: Setup macOS compiler flags
        if: runner.os == 'macOS'
        run: |
          brew install gettext || true
          mkdir -p ~/.R
          if [ -d "/opt/homebrew/opt/gettext" ]; then
            echo "CPPFLAGS += -I/opt/homebrew/opt/gettext/include" >> ~/.R/Makevars
            echo "LDFLAGS += -L/opt/homebrew/opt/gettext/lib" >> ~/.R/Makevars
          elif [ -d "/usr/local/opt/gettext" ]; then
            echo "CPPFLAGS += -I/usr/local/opt/gettext/include" >> ~/.R/Makevars
            echo "LDFLAGS += -L/usr/local/opt/gettext/lib" >> ~/.R/Makevars
          fi

      - name: Pre-install rstantools and spam (required by tipsae configure)
        run: |
          Rscript -e 'install.packages(c("rstantools", "spam"), repos = "https://cloud.r-project.org")'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::knitr?source
            any::xfun?source
          needs: check
          cache-version: 3

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # Emulates the CRAN check machines: --as-cran, NOT_CRAN unset, and no INLA
  # (not on CRAN), so every INLA example, test and vignette chunk must skip.
  cran-like:
    runs-on: ubuntu-latest
    name: CRAN-like (no INLA, --as-cran)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: false
      _R_CHECK_FORCE_SUGGESTS_: false
      _R_CHECK_CRAN_INCOMING_REMOTE_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # Only CRAN Suggests; INLA (not on CRAN) and tipsae (Stan build) are left out
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
            any::dplyr
            any::lme4
            any::MASS
            any::sae
            any::sf
            any::sn
            any::spdep
            any::writexl
            any::openxlsx
          needs: check
          # Own cache key: the shared ubuntu/release prefix can restore the
          # full-matrix library, which has INLA installed
          cache-version: cran-like-1

      - name: Confirm INLA is absent
        run: |
          Rscript -e 'if (requireNamespace("INLA", quietly = TRUE)) remove.packages("INLA")'
          Rscript -e 'stopifnot(!requireNamespace("INLA", quietly = TRUE))'

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual")'
          error-on: '"warning"'
          upload-snapshots: true

  # hb_area(engine = jax_engine()) end to end, with Python, JAX and NumPyro
  jax-engine:
    runs-on: ubuntu-latest
    name: JAX engine (NumPyro, CPU)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      JAX_PLATFORMS: cpu

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Same pins as setup_numpyro_env(device = "cpu")
      - name: Install JAX and NumPyro
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy "jax==0.5.0" "jaxlib==0.5.0" "numpyro==0.19.0"
          echo "RETICULATE_PYTHON=$(which python)" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
          extra-repositories: 'https://inla.r-inla-download.org/R/stable'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::testthat
            any::reticulate
            any::MASS
            any::sn
            INLA
          cache-version: 3

      - name: Install fastsae
        run: R CMD INSTALL .

      - name: Run the JAX engine tests
        shell: Rscript {0}
        run: |
          stopifnot(fastsae::check_numpyro_available(device = "cpu"))
          res <- testthat::test_dir(
            "tests/testthat", filter = "hb_area_engine", package = "fastsae",
            load_package = "installed", reporter = "summary", stop_on_failure = TRUE
          )
          df <- as.data.frame(res)
          if (sum(df$skipped) > 0) stop("JAX engine tests were skipped")
