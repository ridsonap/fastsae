reference:
  - title: "Classical Area-Level Models (EBLUP)"
    desc: "High-performance C++ implementation of Fay-Herriot models"
    contents:
      - eblup_fh
      - eblup_sfh
      - eblup_stfh
  - title: "Bayesian Area-Level Models (INLA)"
    desc: "Hierarchical Bayesian SAE using Integrated Nested Laplace Approximations (INLA) across 6 distributions with spatial and spatio-temporal effects"
    contents:
      - hb_area
  - title: "Estimation Engines"
    desc: "Engine objects for the Hierarchical Bayes models: INLA (default) or MCMC with NumPyro / JAX (optional Python backend)"
    contents:
      - hb_engine
      - setup_numpyro_env
  - title: "Two-Fold Subarea Models"
    desc: "Nested area-subarea level models (Torabi & Rao, 2014) with both area and subarea random effects via REML EBLUP and Bayesian INLA"
    contents:
      - eblup_twofold
      - hb_twofold
  - title: "Unit-Level Models"
    desc: "Battese-Harter-Fuller models for unit-level survey data via REML EBLUP and Bayesian INLA"
    contents:
      - eblup_bhf
      - hb_unit
  - title: "Pre-Modeling Utilities"
    desc: "Spatial weights, spatial autocorrelation tests, and smoothing of sampling variances"
    contents:
      - create_weights
      - spatial_test
      - gvf_smooth
  - title: "Model Diagnostics & Visualization"
    desc: "Universal diagnostic framework and ggplot2 visualization methods"
    contents:
      - diagnose
      - autoplot.fastsae_diagnose
      - autoplot.fastsae
      - autoplot.list
      - summary.fastsae
      - coef.fastsae
      - fitted.fastsae
      - residuals.fastsae
      - print.fastsae
      - print.summary.fastsae
  - title: "Benchmarking & Calibration"
    desc: "Calibrate small area estimates to aggregate targets via Ratio, Difference, Optimal, and Logit methods (Rao & Molina, 2015)"
    contents:
      - benchmark_sae
      - autoplot.fastsae_benchmark
      - print.fastsae_benchmark
      - summary.fastsae_benchmark
  - title: "Model Comparison & Spatial Mapping"
    desc: "Unified spatial choropleth mapping ('satu pintu'), model concordance evaluation, and official publication exports"
    contents:
      - map_sae
      - compare_sae
      - step_sae
      - export_sae
      - add_reliability_flags
      - plot.fastsae
  - title: "Simulation & Synthetic Data Generation"
    desc: "Utilities to simulate area-level cross-sectional, panel, and spatial weight matrices"
    contents:
      - sim_area_data
      - sim_series_data
  - title: "Example & Synthetic Datasets"
    desc: "Built-in empirical and synthetic survey datasets"
    contents:
      - mys
      - mys_panel
      - mys_proxmat
      - cornsoybean
      - cornsoybeanmeans
      - sim_area
      - sim_panel
