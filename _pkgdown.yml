url: https://ridsonap.is-a.dev/fastsae/
title: fastsae

home:
  sidebar:
    html: pkgdown/sidebar.html

template:
  bootstrap: 5
  bootswatch: flatly
  light-switch: true
  bslib:
    primary: "#1D6A5C"
  includes:
    in_header: |
      <script>
        // Force light mode as default for first-time visitors
        if (!localStorage.getItem('theme')) {
          localStorage.setItem('theme', 'light');
          document.documentElement.setAttribute('data-bs-theme', 'light');
        }
        // Initialize language state before render to prevent FOUC
        (function() {
          var savedLang = localStorage.getItem('fastsae_lang') || 'en';
          // Indonesian articles (articles/id/) are always shown in ID mode
          if (/\/articles\/id\//.test(window.location.pathname)) savedLang = 'id';
          document.documentElement.setAttribute('data-lang', savedLang);
          document.documentElement.setAttribute('lang', savedLang);
        })();
      </script>

articles:
  - title: "English"
    contents:
      - "`getting-started`"
      - "`spatial-temporal`"
      - "`hb-area-inla`"
      - "`hb-priors`"
      - "`model-diagnostics`"
      - "`unit-level-bhf`"
      - "`twofold-subarea`"
      - "`benchmarks`"
      - "`articles/hb-area-engines`"
      - "`finite-population-validation`"
  - title: "Bahasa Indonesia"
    desc: "Terjemahan dokumentasi (istilah teknis dipertahankan dalam bahasa Inggris)"
    contents:
      - "`articles/id/beranda`"
      - "`articles/id/glosarium`"
      - "`articles/id/getting-started`"
      - "`articles/id/spatial-temporal`"
      - "`articles/id/hb-area-inla`"
      - "`articles/id/hb-priors`"
      - "`articles/id/model-diagnostics`"
      - "`articles/id/unit-level-bhf`"
      - "`articles/id/twofold-subarea`"
      - "`articles/id/benchmarks`"
      - "`articles/id/hb-area-engines`"
      - "`articles/id/finite-population-validation`"

