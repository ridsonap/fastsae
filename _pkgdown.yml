url: https://ridsonap.github.io/fastsae/
title: fastsae

home:
  sidebar:
    html: pkgdown/sidebar.html

template:
  bootstrap: 5
  bootswatch: flatly
  light-switch: true
  bslib:
    primary: "#1D6A5C"
  includes:
    in_header: |
      <script>
        // Force light mode as default for first-time visitors
        if (!localStorage.getItem('theme')) {
          localStorage.setItem('theme', 'light');
          document.documentElement.setAttribute('data-bs-theme', 'light');
        }
        // Initialize language state before render to prevent FOUC
        (function() {
          var savedLang = localStorage.getItem('fastsae_lang') || 'en';
          document.documentElement.setAttribute('data-lang', savedLang);
        })();
      </script>

navbar:
  structure:
    left:  [intro, articles, reference, benchmarks]
    right: [search, github, lightswitch]
  components:
    intro:
      text: Get Started
      href: articles/getting-started.html
    articles:
      text: Articles
      menu:
        - text: "Getting Started with fastsae"
          href: articles/getting-started.html
        - text: "Spatial & Spatio-Temporal Models (EBLUP)"
          href: articles/spatial-temporal.html
        - text: "Bayesian Area-Level Models (INLA)"
          href: articles/hb-area-inla.html
        - text: "Model Diagnostics & Calibration"
          href: articles/model-diagnostics.html
        - text: "Unit-Level Estimation (BHF)"
          href: articles/unit-level-bhf.html
        - text: "--------------------"
        - text: "Performance Benchmarks"
          href: articles/benchmarks.html
        - text: "Finite Population Validation"
          href: articles/finite-population-validation.html
    benchmarks:
      text: Benchmarks
      href: articles/benchmarks.html
    reference:
      text: Reference
      href: reference/index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/ridsonap/fastsae
      aria-label: GitHub

reference:
  - title: "Classical Area-Level Models (EBLUP)"
    desc: "High-performance C++ implementation of Fay-Herriot models"
    contents:
      - eblup_fh
      - eblup_sfh
      - eblup_stfh
  - title: "Bayesian Area-Level Models (INLA / HB)"
    desc: "Hierarchical Bayesian Small Area Estimation using INLA across 6 distributions with spatial and spatio-temporal effects"
    contents:
      - hb_area
  - title: "Unit-Level Models"
    desc: "Battese-Harter-Fuller model for unit-level survey data"
    contents:
      - eblup_bhf
  - title: "Model Diagnostics & Visualization"
    desc: "Universal diagnostic framework and ggplot2 visualization methods"
    contents:
      - diagnose
      - autoplot.fastsae_diagnose
      - autoplot.fastsae
      - autoplot.list
      - summary.fastsae
      - coef.fastsae
      - fitted.fastsae
      - residuals.fastsae
      - print.fastsae
      - print.summary.fastsae
  - title: "Benchmarking & Calibration"
    desc: "Calibrate small area estimates to aggregate targets via Ratio, Difference, Optimal, and Logit methods (Rao & Molina, 2015)"
    contents:
      - benchmark_sae
      - benchmark
      - autoplot.fastsae_benchmark
      - print.fastsae_benchmark
      - summary.fastsae_benchmark
  - title: "Model Comparison & Spatial Mapping"
    desc: "Unified spatial choropleth mapping ('satu pintu'), model concordance evaluation, and official publication exports"
    contents:
      - map_sae
      - compare_sae
      - export_sae
      - add_reliability_flags
      - plot.fastsae
  - title: "Simulation & Synthetic Data Generation"
    desc: "Utilities to simulate area-level cross-sectional, panel, and spatial weight matrices"
    contents:
      - sim_area_data
      - sim_series_data
      - sim_spatial_weights
  - title: "Example & Synthetic Datasets"
    desc: "Built-in empirical and synthetic survey datasets"
    contents:
      - mys
      - mys_panel
      - mys_proxmat
      - cornsoybean
      - cornsoybeanmeans
      - sim_area
      - sim_panel
