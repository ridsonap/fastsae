url: https://ridsonap.github.io/fastsae/
title: fastsae

template:
  bootstrap: 5
  bootswatch: flatly
  light-switch: true
  bslib:
    primary: "#1D6A5C"
  includes:
    in_header: |
      <script>
        // Force light mode as default for first-time visitors
        if (!localStorage.getItem('theme')) {
          localStorage.setItem('theme', 'light');
          document.documentElement.setAttribute('data-bs-theme', 'light');
        }
      </script>
      <style>
        /* Package version in navbar is white when theme is light */
        [data-bs-theme="light"] .navbar .nav-text,
        :root:not([data-bs-theme="dark"]) .navbar .nav-text {
          color: #ffffff !important;
        }
        /* Hide logo on all pages by default (articles, reference, etc.) */
        img.logo {
          display: none !important;
        }
        /* Prevent page-header border from cutting the logo */
        .page-header {
          border-bottom: none !important;
        }
        .template-home .page-header {
          border-bottom: none !important;
          margin-bottom: 2rem !important;
          padding-bottom: 0.75rem !important;
          min-height: 140px !important;
        }
        .template-home .page-header::after {
          content: "";
          display: table;
          clear: both;
        }
        /* Show logo ONLY on homepage header */
        .template-home .page-header img.logo {
          display: block !important;
          float: right !important;
          width: 125px !important;
          height: auto !important;
          margin-left: 1.5rem !important;
          margin-bottom: 1.5rem !important;
          border: none !important;
          box-shadow: none !important;
        }
        .template-home .page-header h1 {
          padding-top: 0.75rem !important;
          line-height: 1.3 !important;
        }
        /* Ample spacing between package title/logo and description paragraph */
        .template-home .section.level1 > p:first-of-type,
        .template-home .page-header + p {
          margin-top: 1.75rem !important;
          margin-bottom: 2.25rem !important;
          font-size: 1.15rem !important;
          line-height: 1.8 !important;
          clear: both !important;
        }
        .template-home hr {
          margin-top: 2rem !important;
          margin-bottom: 2rem !important;
          opacity: 0.15 !important;
        }
      </style>

navbar:
  structure:
    left:  [intro, articles, reference, benchmarks]
    right: [search, github, lightswitch]
  components:
    intro:
      text: Get Started
      href: articles/getting-started.html
    articles:
      text: Articles
      menu:
        - text: "Getting Started with fastsae"
          href: articles/getting-started.html
        - text: "Spatial & Spatio-Temporal Models (EBLUP)"
          href: articles/spatial-temporal.html
        - text: "Bayesian Area-Level Models (INLA)"
          href: articles/ebp-area-inla.html
        - text: "Model Diagnostics & Calibration"
          href: articles/model-diagnostics.html
        - text: "Unit-Level Estimation (BHF)"
          href: articles/unit-level-bhf.html
        - text: "--------------------"
        - text: "Performance Benchmarks"
          href: articles/benchmarks.html
    benchmarks:
      text: Benchmarks
      href: articles/benchmarks.html
    reference:
      text: Reference
      href: reference/index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/ridsonap/fastsae
      aria-label: GitHub

reference:
  - title: "Classical Area-Level Models (EBLUP)"
    desc: "High-performance C++ implementation of Fay-Herriot models"
    contents:
      - eblup_fh
      - eblup_sfh
      - eblup_stfh
  - title: "Bayesian Area-Level Models (INLA / EBP)"
    desc: "Hierarchical Bayesian Small Area Estimation using INLA across 6 distributions with spatial and spatio-temporal effects"
    contents:
      - ebp_area
  - title: "Unit-Level Models"
    desc: "Battese-Harter-Fuller model for unit-level survey data"
    contents:
      - eblup_bhf
  - title: "Model Diagnostics & Visualization"
    desc: "Universal diagnostic framework and ggplot2 visualization methods"
    contents:
      - diagnose
      - autoplot.fastsae_diagnose
      - autoplot.fastsae
      - autoplot.list
      - summary.fastsae
      - coef.fastsae
      - fitted.fastsae
      - residuals.fastsae
      - print.fastsae
      - print.summary.fastsae
  - title: "Simulation & Synthetic Data Generation"
    desc: "Utilities to simulate area-level cross-sectional, panel, and spatial weight matrices"
    contents:
      - sim_area_data
      - sim_series_data
      - sim_spatial_weights
  - title: "Example & Synthetic Datasets"
    desc: "Built-in empirical and synthetic survey datasets"
    contents:
      - mys
      - mys_panel
      - mys_proxmat
      - cornsoybean
      - cornsoybeanmeans
      - sim_area
      - sim_panel
